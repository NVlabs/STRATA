[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "screamcast"
authors = [
  { name="Noah Brenowitz"},
]
description = "A SCREAM Emulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache 2.0"}
dependencies = [
    "torch>=2.10.0",
    "numpy>=2.1",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "xarray>=2026.7",
    "zarr>=3",
    # not on PyPI: direct reference to the commit the release was verified
    # against (same archive docker/Dockerfile installs)
    "earth2grid @ https://github.com/NVlabs/earth2grid/archive/3415382a37e414a867d4c6ae2519e3e8afdbece1.tar.gz",
    "earth2studio>=0.13",
    "einops>=0.8",
    "scipy>=1.16",
    "cftime>=1.6.5",
    "cartopy>=0.25",
    "fme==2026.1.1",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "nvtx>=0.2.14",
    "natten>=0.21.5",
    "typer>=0.26",
    "tqdm>=4.67",
    "torchmetrics>=1.9.0",
    "lightning>=2.6.1",
    "pytorch-optimizer>=3.10.0",
    "tensorboard>=2.20.0",
    "lmdb>=2.2.0",
    # >=2.2.0a0: the Strata models ship in 2.2 (PyPI 2.1.x would import-fail);
    # the pinned archive below provides 2.2.0a0.
    "nvidia-physicsnemo>=2.2.0a0",
    "h5netcdf>=1.8",
    "netCDF4>=1.7",
    "h5py>=3.16",
    # fme imports pkg_resources, which setuptools 81 removed (same pin the
    # docker image carries)
    "setuptools<81",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.optional-dependencies]
analysis = [
    "altair>=5.0",
    "fsspec>=2026.6",
    "joblib>=1.5",
    "plotly>=6.9",
    "seaborn>=0.13",
    "wandb>=0.28",
]
s3 = [
    "multi-storage-client[boto3]>=0.14.1",
    "s3fs>=2025.10",
]
cu12 = [
    "nvidia-dali-cuda120>=1.47",
]
cu13 = [
    "nvidia-dali-cuda130>=1.53",
]
dev = [
    "pytest-regtest>=2.1",
    "pytest>=8.1",
]
notebooks = [
    "marimo>=0.23",
]

[tool.setuptools.dynamic]
version = {attr = "screamcast.__version__"}

[tool.setuptools.packages.find]
include = ["screamcast", "screamcast.*"]

[tool.ruff]
# Enable flake8/pycodestyle (`E`), Pyflakes (`F`), flake8-bandit (`S`),
# isort (`I`), and performance 'PERF' rules.
select = ["E", "F", "S", "I", "PERF"]
fixable = ["I"]

# Never enforce `E402`, `E501` (line length violations),
# and `S311` (random number generators)
ignore = ["E501", "S311"]

# Exclude the examples folder
exclude = ["examples"]

[tool.ruff.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files, and in `docs/*.py`.
"__init__.py" = ["F401"]
"docs/*.py" = ["F401"]

# Ignore `S101` (assertions) in all `test` files.
"tests/*.py" = ["S101"]

[tool.uv.sources]
# Pinned to physicsnemo main including the Strata models + stereographic RoPE
# (PR #1750). Switch to `nvidia-physicsnemo>=2.2` on PyPI once 2.2.0 is released.
nvidia-physicsnemo = { url = "https://github.com/NVIDIA/physicsnemo/archive/07cdcc8b65f10bee733a32a77b4b76e20c70c54c.tar.gz" }
