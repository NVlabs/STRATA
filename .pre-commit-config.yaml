repos:
-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    - id: black
      # black 22.10.0 uses ast.Str which was removed in Python 3.14; pinning to
      # 3.12 avoids the crash without reformatting code. Ideally, upgrade black
      # to a newer version instead of pinning the language version here.
      language_version: python3.12
      exclude: "(docs|modulus/experimental)"
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.290
    hooks:
    - id: ruff
      args: [--fix]
      exclude: (^docs/|^modulus_vendorized/)

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-added-large-files
      args: [--maxkb=5000]
